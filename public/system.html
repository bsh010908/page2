<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>영화 검색</title>
    <link href="assets/css/default.css" rel="stylesheet">
    <link href="assets/css/movie.css" rel="stylesheet">
</head>

<body>
    <div id="cmmContainer"></div>

    <nav class="breadcrumb"></nav>

    <div id="content">
        <div class="flex flex-col lg:flex-row justify-between items-center py-2">
            <div id="dataCount" class="text-sm text-gray-700 mb-2 lg:mb-0">Total :</div>
            <div class="flex flex2 flex-col lg:flex-row items-center space-y-2 lg:space-y-0 lg:space-x-2">
                <div class="flex items-center space-x-2">
                    <input type="text" id="movieTitle" placeholder="영화 제목">
                    <select id="movieGenre">
                        <option value="">전체 장르</option>
                    </select>
                    <button id="searchBtn" class="p-2 bg-blue-500 text-white rounded">검색</button>
                </div>
            </div>
        </div>

        <div id="grid" class="movie-grid"></div>
         
  <aside id="movieDetail" class="movie-detail" aria-live="polite"></aside>
    </div>

    <script type="module" src="assets/vendor/tui-pagination/dist/tui-pagination.js"></script>
    <script type="module" src="assets/vendor/tui-grid/dist/tui-grid.js"></script>
    <script type="text/javascript" src="assets/vendor/pikaday/pikaday.js"></script>
    <script type="module" src="assets/js/logomodule.js"></script>
    <script type="module" src="assets/js/movie.js"></script>
</body>

</html>
